version: '3.8'

services:
  shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./shop.db:/app/shop.db
    restart: always

  # Маршрутизатор для расчёта доставки по дорогам (handlers/delivery.py).
  # Карта готовится один раз: bash osrm/prepare.sh. Порт наружу не публикуется.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/city.osrm
    volumes:
      - ./osrm-data:/data:ro
    mem_limit: 300m
    restart: always